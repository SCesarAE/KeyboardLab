name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: cp ../firmware/diag/code.py public/firmware/code.py
      # CircuitPython para nice!nano: se incluye en la app para el flash asistido
      - name: Descargar CircuitPython
        env:
          CP_VERSION: 10.3.2
        run: |
          curl -fsSL -o public/firmware/circuitpython-nice_nano.uf2 \
            "https://downloads.circuitpython.org/bin/nice_nano/en_US/adafruit-circuitpython-nice_nano-en_US-${CP_VERSION}.uf2" \
            || echo "::warning::No se pudo descargar CircuitPython; la app pedira el archivo"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
